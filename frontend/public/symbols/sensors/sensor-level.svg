<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="levelWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Ultrasonic sensor housing (top) -->
  <rect x="35" y="8" width="30" height="18" fill="#334155" stroke="#0f172a" stroke-width="2" rx="2"/>

  <!-- Sensor bottom (transducer face) -->
  <rect x="38" y="24" width="24" height="4" fill="#525252" stroke="#0f172a" stroke-width="1"/>

  <!-- Ultrasonic waves emanating down -->
  <path d="M 40 30 Q 42 33 40 36" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
  <path d="M 45 30 Q 47 34 45 38" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
  <path d="M 50 30 Q 52 34 50 38" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
  <path d="M 55 30 Q 57 34 55 38" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>
  <path d="M 60 30 Q 62 33 60 36" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.7"/>

  <!-- Tank walls -->
  <line x1="15" y1="35" x2="15" y2="88" stroke="#475569" stroke-width="2"/>
  <line x1="85" y1="35" x2="85" y2="88" stroke="#475569" stroke-width="2"/>
  <line x1="15" y1="88" x2="85" y2="88" stroke="#475569" stroke-width="2"/>

  <!-- Water level (65% full) -->
  <rect x="17" y="52" width="66" height="35" fill="url(#levelWater)"/>

  <!-- Water surface wave -->
  <path d="M 17 52 Q 25 49 35 52 T 55 52 T 75 52 T 85 52" fill="none" stroke="#0369a1" stroke-width="1" opacity="0.5"/>

  <!-- Level indicator line/dot -->
  <line x1="88" y1="52" x2="94" y2="52" stroke="#dc2626" stroke-width="1.5"/>
  <text x="98" y="55" text-anchor="end" font-family="Arial" font-size="7" fill="#dc2626">65%</text>

  <!-- Cable to sensor top -->
  <line x1="50" y1="8" x2="50" y2="3" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="50" cy="2" r="1.5" fill="#dc2626"/>

  <!-- LED indicator on sensor -->
  <circle cx="60" cy="16" r="1.5" fill="#22c55e"/>
</svg>