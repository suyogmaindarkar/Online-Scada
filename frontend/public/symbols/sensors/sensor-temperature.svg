<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="thermoLiquid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Thermometer bulb (bottom) -->
  <circle cx="50" cy="78" r="12" fill="#dc2626" stroke="#7f1d1d" stroke-width="2"/>

  <!-- Thermometer tube -->
  <rect x="45" y="15" width="10" height="65" fill="#f3f4f6" stroke="#7f1d1d" stroke-width="2" rx="2"/>

  <!-- Mercury/liquid inside (60% fill) -->
  <rect x="47" y="35" width="6" height="45" fill="url(#thermoLiquid)"/>
  <circle cx="50" cy="78" r="8" fill="#dc2626"/>

  <!-- Top rounded cap -->
  <ellipse cx="50" cy="15" rx="5" ry="2" fill="#7f1d1d"/>

  <!-- Temperature scale marks (right side) -->
  <line x1="55" y1="20" x2="60" y2="20" stroke="#1f2937" stroke-width="1"/>
  <text x="63" y="22" font-family="Arial" font-size="6" fill="#1f2937">100</text>

  <line x1="55" y1="35" x2="60" y2="35" stroke="#1f2937" stroke-width="1"/>
  <text x="63" y="37" font-family="Arial" font-size="6" fill="#1f2937">75</text>

  <line x1="55" y1="50" x2="60" y2="50" stroke="#1f2937" stroke-width="1"/>
  <text x="63" y="52" font-family="Arial" font-size="6" fill="#1f2937">50</text>

  <line x1="55" y1="65" x2="60" y2="65" stroke="#1f2937" stroke-width="1"/>
  <text x="63" y="67" font-family="Arial" font-size="6" fill="#1f2937">25</text>

  <!-- Scale ticks (left) -->
  <line x1="40" y1="20" x2="45" y2="20" stroke="#1f2937" stroke-width="1"/>
  <line x1="40" y1="35" x2="45" y2="35" stroke="#1f2937" stroke-width="1"/>
  <line x1="40" y1="50" x2="45" y2="50" stroke="#1f2937" stroke-width="1"/>
  <line x1="40" y1="65" x2="45" y2="65" stroke="#1f2937" stroke-width="1"/>

  <!-- °C label -->
  <text x="30" y="18" font-family="Arial" font-size="8" font-weight="bold" fill="#7f1d1d">°C</text>
</svg>