<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="flowBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Left pipe (inlet) -->
  <rect x="5" y="45" width="20" height="12" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Right pipe (outlet) -->
  <rect x="75" y="45" width="20" height="12" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Flow meter body (center) -->
  <rect x="25" y="30" width="50" height="42" fill="url(#flowBody)" stroke="#0369a1" stroke-width="2" rx="3"/>

  <!-- Display window -->
  <rect x="30" y="35" width="40" height="14" fill="#0f172a" stroke="#000" stroke-width="0.5"/>
  <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#22c55e">120.5</text>

  <!-- Unit -->
  <text x="50" y="59" text-anchor="middle" font-family="Arial" font-size="6" fill="#075985">L/min</text>

  <!-- Flow arrows inside pipe -->
  <polygon points="35,66 40,63 40,69" fill="#3b82f6"/>
  <polygon points="45,66 50,63 50,69" fill="#3b82f6"/>
  <polygon points="55,66 60,63 60,69" fill="#3b82f6"/>

  <!-- Flow direction indicator (right arrow at top) -->
  <polygon points="52,25 60,20 60,30" fill="#22c55e" stroke="#059669" stroke-width="0.5"/>
  <text x="42" y="26" text-anchor="middle" font-family="Arial" font-size="6" fill="#059669">FLOW</text>

  <!-- Electrical connection (top) -->
  <rect x="46" y="12" width="8" height="18" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <line x1="50" y1="8" x2="50" y2="12" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="47" y1="9" x2="53" y2="9" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Base -->
  <rect x="20" y="78" width="60" height="6" fill="#475569" stroke="#1e293b" stroke-width="1"/>

  <!-- Label -->
  <text x="50" y="93" text-anchor="middle" font-family="Arial" font-size="7" fill="#6b7280">FLOW METER</text>
</svg>