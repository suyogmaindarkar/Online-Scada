<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="gaugeGrad" cx="0.5" cy="0.5">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="80%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </radialGradient>
  </defs>

  <!-- Outer bezel -->
  <circle cx="50" cy="40" r="32" fill="#4b5563" stroke="#1f2937" stroke-width="2"/>

  <!-- Inner dial face -->
  <circle cx="50" cy="40" r="28" fill="url(#gaugeGrad)" stroke="#1f2937" stroke-width="1"/>

  <!-- Scale arc -->
  <path d="M 30 55 A 20 20 0 1 1 70 55" fill="none" stroke="#1f2937" stroke-width="1"/>

  <!-- Scale marks -->
  <line x1="30" y1="55" x2="27" y2="58" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="35" y1="30" x2="32" y2="27" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="50" y1="20" x2="50" y2="16" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="65" y1="30" x2="68" y2="27" stroke="#1f2937" stroke-width="1.5"/>
  <line x1="70" y1="55" x2="73" y2="58" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Danger zone (red arc, right side) -->
  <path d="M 63 25 A 20 20 0 0 1 70 55" fill="none" stroke="#dc2626" stroke-width="4"/>

  <!-- Warning zone (yellow) -->
  <path d="M 53 20 A 20 20 0 0 1 63 25" fill="none" stroke="#f59e0b" stroke-width="4"/>

  <!-- Normal zone (green) -->
  <path d="M 30 55 A 20 20 0 0 1 53 20" fill="none" stroke="#10b981" stroke-width="4"/>

  <!-- Numbers -->
  <text x="25" y="60" text-anchor="middle" font-family="Arial" font-size="7" fill="#1f2937">0</text>
  <text x="50" y="14" text-anchor="middle" font-family="Arial" font-size="7" fill="#1f2937">50</text>
  <text x="75" y="60" text-anchor="middle" font-family="Arial" font-size="7" fill="#1f2937">100</text>

  <!-- Needle pointing to ~60 -->
  <line x1="50" y1="40" x2="63" y2="25" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="40" r="3" fill="#1f2937"/>

  <!-- Unit label -->
  <text x="50" y="55" text-anchor="middle" font-family="Arial" font-size="6" fill="#6b7280">bar</text>

  <!-- Connection stem (bottom) -->
  <rect x="46" y="72" width="8" height="12" fill="#6b7280" stroke="#1f2937" stroke-width="1"/>
  <rect x="42" y="84" width="16" height="6" fill="#4b5563" stroke="#1f2937" stroke-width="1"/>

  <!-- Threads on stem -->
  <line x1="47" y1="75" x2="53" y2="75" stroke="#374151" stroke-width="0.5"/>
  <line x1="47" y1="78" x2="53" y2="78" stroke="#374151" stroke-width="0.5"/>
  <line x1="47" y1="81" x2="53" y2="81" stroke="#374151" stroke-width="0.5"/>
</svg>