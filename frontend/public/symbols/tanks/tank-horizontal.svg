<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tankBodyH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Left end cap -->
  <ellipse cx="15" cy="50" rx="8" ry="25" fill="#64748b" stroke="#1e293b" stroke-width="2"/>

  <!-- Main horizontal body -->
  <rect x="15" y="25" width="70" height="50" fill="url(#tankBodyH)" stroke="#1e293b" stroke-width="2"/>

  <!-- Right end cap -->
  <ellipse cx="85" cy="50" rx="8" ry="25" fill="#64748b" stroke="#1e293b" stroke-width="2"/>

  <!-- Liquid (50% full - shows horizontally split) -->
  <rect x="15" y="50" width="70" height="25" fill="#38bdf8" opacity="0.7"/>
  <ellipse cx="15" cy="62.5" rx="8" ry="12.5" fill="#0284c7" opacity="0.7"/>
  <ellipse cx="85" cy="62.5" rx="8" ry="12.5" fill="#0284c7" opacity="0.7"/>

  <!-- Top inlet -->
  <rect x="46" y="15" width="8" height="12" fill="#71717a" stroke="#1e293b" stroke-width="1"/>
  <rect x="42" y="10" width="16" height="6" fill="#374151" stroke="#1e293b" stroke-width="1"/>

  <!-- Bottom outlet -->
  <rect x="46" y="75" width="8" height="12" fill="#71717a" stroke="#1e293b" stroke-width="1"/>

  <!-- Support saddles (2) -->
  <path d="M 25 80 L 20 92 L 40 92 L 35 80 Z" fill="#475569" stroke="#1e293b" stroke-width="1"/>
  <path d="M 65 80 L 60 92 L 80 92 L 75 80 Z" fill="#475569" stroke="#1e293b" stroke-width="1"/>

  <!-- Manway (top center) -->
  <circle cx="50" cy="28" r="4" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <circle cx="50" cy="28" r="1" fill="#000"/>
</svg>