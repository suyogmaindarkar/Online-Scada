<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="fuelBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#292524"/>
      <stop offset="50%" stop-color="#57534e"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="fuelLiquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Main tank body (horizontal cylinder) -->
  <ellipse cx="15" cy="55" rx="8" ry="25" fill="#3f3f46" stroke="#0c0a09" stroke-width="2"/>
  <rect x="15" y="30" width="70" height="50" fill="url(#fuelBody)" stroke="#0c0a09" stroke-width="2"/>
  <ellipse cx="85" cy="55" rx="8" ry="25" fill="#3f3f46" stroke="#0c0a09" stroke-width="2"/>

  <!-- Fuel inside (70% full) -->
  <rect x="15" y="45" width="70" height="35" fill="url(#fuelLiquid)"/>
  <ellipse cx="15" cy="62.5" rx="8" ry="17.5" fill="#78350f"/>
  <ellipse cx="85" cy="62.5" rx="8" ry="17.5" fill="#78350f"/>

  <!-- Filler cap (top) -->
  <rect x="46" y="18" width="8" height="14" fill="#57534e" stroke="#0c0a09" stroke-width="1"/>
  <circle cx="50" cy="18" r="4" fill="#171717" stroke="#000" stroke-width="0.5"/>
  <text x="50" y="20" text-anchor="middle" font-family="Arial" font-size="4" fill="#fbbf24">F</text>

  <!-- Level gauge -->
  <rect x="70" y="35" width="4" height="40" fill="#0f172a" stroke="#000" stroke-width="0.5"/>
  <rect x="70" y="49" width="4" height="26" fill="#a16207"/>

  <!-- Outlet valve (bottom right) -->
  <rect x="80" y="76" width="6" height="10" fill="#525252" stroke="#0c0a09" stroke-width="1"/>
  <circle cx="83" cy="86" r="3" fill="#fbbf24" stroke="#0c0a09" stroke-width="0.5"/>

  <!-- Support saddles -->
  <path d="M 22 80 L 18 92 L 38 92 L 34 80 Z" fill="#292524" stroke="#0c0a09" stroke-width="1"/>
  <path d="M 66 80 L 62 92 L 82 92 L 78 80 Z" fill="#292524" stroke="#0c0a09" stroke-width="1"/>

  <!-- Fuel type label -->
  <rect x="35" y="55" width="30" height="12" fill="#fef3c7" stroke="#a16207" stroke-width="0.5" rx="1"/>
  <text x="50" y="63" text-anchor="middle" font-family="Arial" font-size="7" font-weight="bold" fill="#78350f">DIESEL</text>
</svg>