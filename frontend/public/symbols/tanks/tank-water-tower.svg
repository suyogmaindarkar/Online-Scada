<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="towerBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Tank body (top - spherical) -->
  <ellipse cx="50" cy="25" rx="25" ry="18" fill="url(#towerBody)" stroke="#1e293b" stroke-width="2"/>

  <!-- Water inside tank (visible from opening) -->
  <ellipse cx="50" cy="27" rx="22" ry="14" fill="#38bdf8" opacity="0.6"/>

  <!-- Tank top vent -->
  <rect x="47" y="6" width="6" height="6" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <path d="M 44 4 L 56 4 L 53 8 L 47 8 Z" fill="#374151" stroke="#1e293b" stroke-width="1"/>

  <!-- Access ladder on side -->
  <line x1="76" y1="10" x2="76" y2="42" stroke="#374151" stroke-width="1.5"/>
  <line x1="80" y1="10" x2="80" y2="42" stroke="#374151" stroke-width="1.5"/>
  <line x1="76" y1="15" x2="80" y2="15" stroke="#374151" stroke-width="1"/>
  <line x1="76" y1="20" x2="80" y2="20" stroke="#374151" stroke-width="1"/>
  <line x1="76" y1="25" x2="80" y2="25" stroke="#374151" stroke-width="1"/>
  <line x1="76" y1="30" x2="80" y2="30" stroke="#374151" stroke-width="1"/>
  <line x1="76" y1="35" x2="80" y2="35" stroke="#374151" stroke-width="1"/>

  <!-- Support tower (central pipe) -->
  <rect x="45" y="42" width="10" height="45" fill="url(#towerBody)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Support legs (4 legs) -->
  <line x1="30" y1="88" x2="45" y2="42" stroke="#334155" stroke-width="2"/>
  <line x1="70" y1="88" x2="55" y2="42" stroke="#334155" stroke-width="2"/>

  <!-- Cross braces -->
  <line x1="35" y1="70" x2="65" y2="70" stroke="#475569" stroke-width="1"/>
  <line x1="30" y1="88" x2="70" y2="88" stroke="#475569" stroke-width="1"/>

  <!-- Water outlet at bottom -->
  <rect x="47" y="85" width="6" height="10" fill="#71717a" stroke="#1e293b" stroke-width="1"/>

  <!-- H2O label -->
  <text x="50" y="30" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#0369a1">H₂O</text>
</svg>