<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tankChem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="50%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
  </defs>

  <!-- Top dome -->
  <path d="M 25 20 Q 50 5 75 20" fill="url(#tankChem)" stroke="#991b1b" stroke-width="2"/>

  <!-- Main body -->
  <rect x="25" y="20" width="50" height="60" fill="url(#tankChem)" stroke="#991b1b" stroke-width="2"/>

  <!-- Chemical liquid (yellow, 65% full) -->
  <rect x="27" y="42" width="46" height="38" fill="#fbbf24" opacity="0.85"/>

  <!-- Bottom -->
  <ellipse cx="50" cy="80" rx="25" ry="5" fill="#7f1d1d" stroke="#991b1b" stroke-width="2"/>

  <!-- Danger diamond warning -->
  <rect x="42" y="30" width="16" height="16" fill="#fef3c7" stroke="#78350f" stroke-width="1" transform="rotate(45 50 38)"/>
  <text x="50" y="42" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#78350f">!</text>

  <!-- Vent on top -->
  <rect x="46" y="10" width="8" height="8" fill="#525252" stroke="#171717" stroke-width="1"/>
  <path d="M 42 6 L 58 6 L 55 10 L 45 10 Z" fill="#525252" stroke="#171717" stroke-width="1"/>

  <!-- Corrosion-resistant valve -->
  <rect x="46" y="80" width="8" height="10" fill="#78716c" stroke="#171717" stroke-width="1"/>
  <circle cx="50" cy="88" r="3" fill="#ef4444" stroke="#78350f" stroke-width="1"/>

  <!-- Corrosive symbol -->
  <text x="50" y="65" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#7f1d1d">CORR</text>

  <!-- Support base -->
  <rect x="20" y="90" width="60" height="6" fill="#78716c" stroke="#171717" stroke-width="1"/>
</svg>