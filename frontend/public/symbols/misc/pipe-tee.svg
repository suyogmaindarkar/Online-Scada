<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pipeTee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Horizontal main pipe -->
  <rect x="5" y="40" width="90" height="20" fill="url(#pipeTee)" stroke="#1e293b" stroke-width="2"/>

  <!-- Vertical branch pipe -->
  <rect x="40" y="45" width="20" height="50" fill="url(#pipeTee)" stroke="#1e293b" stroke-width="2"/>

  <!-- Cover the joint corner -->
  <rect x="40" y="40" width="20" height="10" fill="url(#pipeTee)" stroke="none"/>

  <!-- Junction reinforcement -->
  <ellipse cx="50" cy="50" rx="12" ry="8" fill="#64748b" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>

  <!-- Flow arrows -->
  <polygon points="15,50 20,47 20,53" fill="#22c55e"/>
  <polygon points="80,50 85,47 85,53" fill="#22c55e"/>
  <polygon points="50,75 47,80 53,80" fill="#22c55e"/>

  <!-- Connection flanges -->
  <rect x="3" y="35" width="4" height="30" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <rect x="93" y="35" width="4" height="30" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <rect x="35" y="92" width="30" height="4" fill="#374151" stroke="#1e293b" stroke-width="1"/>

  <!-- Bolts -->
  <circle cx="5" cy="42" r="1" fill="#1e293b"/>
  <circle cx="5" cy="58" r="1" fill="#1e293b"/>
  <circle cx="95" cy="42" r="1" fill="#1e293b"/>
  <circle cx="95" cy="58" r="1" fill="#1e293b"/>
</svg>