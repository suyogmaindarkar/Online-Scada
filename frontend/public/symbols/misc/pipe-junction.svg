<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pipeCross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Horizontal main pipe -->
  <rect x="5" y="40" width="90" height="20" fill="url(#pipeCross)" stroke="#1e293b" stroke-width="2"/>

  <!-- Vertical pipe (full - top to bottom) -->
  <rect x="40" y="5" width="20" height="90" fill="url(#pipeCross)" stroke="#1e293b" stroke-width="2"/>

  <!-- Fill the corner intersections -->
  <rect x="40" y="40" width="20" height="20" fill="url(#pipeCross)" stroke="none"/>

  <!-- Junction center (raised) -->
  <circle cx="50" cy="50" r="10" fill="#64748b" stroke="#1e293b" stroke-width="1"/>
  <circle cx="50" cy="50" r="4" fill="#334155"/>

  <!-- Flow arrows (4 directions) -->
  <polygon points="15,50 20,47 20,53" fill="#22c55e"/>
  <polygon points="80,50 85,47 85,53" fill="#22c55e"/>
  <polygon points="50,15 47,20 53,20" fill="#22c55e"/>
  <polygon points="50,80 47,85 53,85" fill="#22c55e"/>

  <!-- Connection flanges (4 sides) -->
  <rect x="3" y="35" width="4" height="30" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <rect x="93" y="35" width="4" height="30" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <rect x="35" y="3" width="30" height="4" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <rect x="35" y="93" width="30" height="4" fill="#374151" stroke="#1e293b" stroke-width="1"/>

  <!-- Label -->
  <text x="50" y="52" text-anchor="middle" font-family="Arial" font-size="4" fill="#f9fafb">4-WAY</text>
</svg>