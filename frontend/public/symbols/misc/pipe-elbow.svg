<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pipeElbow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Horizontal pipe (left side) -->
  <rect x="5" y="40" width="45" height="20" fill="url(#pipeElbow)" stroke="#1e293b" stroke-width="2"/>

  <!-- Vertical pipe (bottom) -->
  <rect x="40" y="45" width="20" height="50" fill="url(#pipeElbow)" stroke="#1e293b" stroke-width="2"/>

  <!-- Elbow curve (rounded corner) -->
  <path d="M 40 40 Q 60 40 60 60" fill="none" stroke="#1e293b" stroke-width="2"/>
  <path d="M 50 40 Q 60 40 60 50" fill="url(#pipeElbow)" stroke="#1e293b" stroke-width="0.5"/>

  <!-- Flow direction arrow -->
  <polygon points="20,50 26,47 26,53" fill="#22c55e"/>

  <!-- Elbow shading -->
  <circle cx="50" cy="50" r="3" fill="#334155" opacity="0.5"/>

  <!-- Connection flanges -->
  <rect x="3" y="35" width="4" height="30" fill="#374151" stroke="#1e293b" stroke-width="1"/>
  <rect x="35" y="92" width="30" height="4" fill="#374151" stroke="#1e293b" stroke-width="1"/>

  <!-- Bolts on flanges -->
  <circle cx="5" cy="42" r="1" fill="#1e293b"/>
  <circle cx="5" cy="58" r="1" fill="#1e293b"/>
  <circle cx="43" cy="94" r="1" fill="#1e293b"/>
  <circle cx="57" cy="94" r="1" fill="#1e293b"/>
</svg>