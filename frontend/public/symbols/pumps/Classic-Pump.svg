<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Main Volute Housing -->
    <radialGradient id="classicHousingGrad" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="40%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </radialGradient>

    <!-- Inner Motor Housing -->
    <linearGradient id="classicInnerGrad" x1="0.2" y1="0.2" x2="0.8" y2="0.8">
      <stop offset="0%" stop-color="#d4d4d8"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Horizontal Pipe (Top-to-bottom cylindrical gradient) -->
    <linearGradient id="classicPipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="35%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Base Pedestal & Ground Plate -->
    <linearGradient id="classicBaseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Right Pipe Flange -->
    <linearGradient id="classicFlangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
  </defs>

  <!-- ====== LAYER 1: BASE & GROUND PLATE ====== -->
  <!-- Trapezoidal Pedestal -->
  <polygon points="20,74 56,74 64,88 12,88"
           fill="url(#classicBaseGrad)" stroke="#18181b" stroke-width="0.8"/>
  
  <!-- Flat Ground Plate -->
  <rect x="10" y="88" width="56" height="5" rx="1"
        fill="url(#classicBaseGrad)" stroke="#18181b" stroke-width="0.8"/>
  <line x1="11" y1="89.5" x2="65" y2="89.5"
        stroke="#a1a1aa" stroke-width="0.3" opacity="0.4"/>

  <!-- ====== LAYER 2: HORIZONTAL DISCHARGE PIPE (Drawn before housing) ====== -->
  <!-- Pipe body extending deep inside housing (x=30 to x=88) to prevent gaps -->
  <rect x="30" y="24" width="58" height="18"
        fill="url(#classicPipeGrad)" stroke="#18181b" stroke-width="0.8"/>
  
  <!-- Pipe specular highlight -->
  <rect x="30" y="26" width="56" height="2.5" rx="0.5"
        fill="#d4d4d8" opacity="0.2"/>

  <!-- Right Flange -->
  <rect x="88" y="20" width="6" height="26" rx="1"
        fill="url(#classicFlangeGrad)" stroke="#18181b" stroke-width="0.8"/>
  <line x1="89.5" y1="21" x2="89.5" y2="45"
        stroke="#d4d4d8" stroke-width="0.3" opacity="0.4"/>

  <!-- ====== LAYER 3: MAIN PUMP HOUSING (Drawn over pipe joint) ====== -->
  <!-- Outer Casing Circle -->
  <circle cx="40" cy="50" r="26"
          fill="url(#classicHousingGrad)" stroke="#18181b" stroke-width="1"/>

  <!-- Inner Motor Housing Circle -->
  <circle cx="40" cy="50" r="16"
          fill="url(#classicInnerGrad)" stroke="#27272a" stroke-width="0.8"/>
  
  <!-- Bevel Ring -->
  <circle cx="40" cy="50" r="14"
          fill="none" stroke="#52525b" stroke-width="1"/>

  <!-- Center Hub / Axle -->
  <circle cx="40" cy="50" r="5"
          fill="#3f3f46" stroke="#18181b" stroke-width="0.6"/>
  <circle cx="40" cy="50" r="1.8" fill="#18181b"/>
</svg>