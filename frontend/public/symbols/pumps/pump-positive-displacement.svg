<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="pdPumpBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
  </defs>

  <!-- Rectangular gear pump body -->
  <rect x="20" y="30" width="60" height="45" fill="url(#pdPumpBody)" stroke="#1f2937" stroke-width="2" rx="4"/>

  <!-- Two interlocking gears -->
  <circle cx="38" cy="52" r="14" fill="#6b7280" stroke="#1f2937" stroke-width="1.5"/>
  <circle cx="62" cy="52" r="14" fill="#6b7280" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Gear teeth (simplified) -->
  <path d="M 38 40 L 40 38 L 42 40 M 38 64 L 40 66 L 42 64" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M 62 40 L 60 38 L 58 40 M 62 64 L 60 66 L 58 64" stroke="#374151" stroke-width="1.5" fill="none"/>

  <!-- Centers -->
  <circle cx="38" cy="52" r="3" fill="#1f2937"/>
  <circle cx="62" cy="52" r="3" fill="#1f2937"/>

  <!-- Inlet (left) -->
  <rect x="5" y="45" width="15" height="14" fill="#9ca3af" stroke="#1f2937" stroke-width="1"/>
  <text x="12" y="53" text-anchor="middle" font-family="Arial" font-size="6" fill="#1f2937">IN</text>

  <!-- Outlet (right) -->
  <rect x="80" y="45" width="15" height="14" fill="#9ca3af" stroke="#1f2937" stroke-width="1"/>
  <text x="87" y="53" text-anchor="middle" font-family="Arial" font-size="6" fill="#1f2937">OUT</text>

  <!-- Base -->
  <rect x="15" y="80" width="70" height="6" fill="#374151" stroke="#1f2937" stroke-width="1"/>

  <!-- Label -->
  <text x="50" y="93" text-anchor="middle" font-family="Arial" font-size="7" fill="#6b7280">PD PUMP</text>
</svg>