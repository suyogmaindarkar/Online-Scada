<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="submersibleBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#075985"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
  </defs>

  <!-- Top motor section -->
  <rect x="35" y="10" width="30" height="30" fill="url(#submersibleBody)" stroke="#0c4a6e" stroke-width="2" rx="2"/>

  <!-- Cable coming out top -->
  <line x1="50" y1="10" x2="50" y2="3" stroke="#1f2937" stroke-width="2"/>
  <circle cx="50" cy="2" r="1.5" fill="#dc2626"/>

  <!-- Cooling fins on motor -->
  <rect x="35" y="18" width="30" height="1.5" fill="#0c4a6e"/>
  <rect x="35" y="23" width="30" height="1.5" fill="#0c4a6e"/>
  <rect x="35" y="28" width="30" height="1.5" fill="#0c4a6e"/>
  <rect x="35" y="33" width="30" height="1.5" fill="#0c4a6e"/>

  <!-- Middle joining section -->
  <rect x="38" y="40" width="24" height="8" fill="#7c3aed" stroke="#1f2937" stroke-width="1"/>

  <!-- Pump section (tapered) -->
  <path d="M 35 48 L 65 48 L 60 78 L 40 78 Z" fill="#374151" stroke="#111827" stroke-width="1.5"/>

  <!-- Bottom impeller area (dark) -->
  <ellipse cx="50" cy="78" rx="10" ry="3" fill="#111827" stroke="#000000" stroke-width="1"/>

  <!-- Water intake slits -->
  <line x1="42" y1="60" x2="58" y2="60" stroke="#111827" stroke-width="1"/>
  <line x1="42" y1="65" x2="58" y2="65" stroke="#111827" stroke-width="1"/>
  <line x1="42" y1="70" x2="58" y2="70" stroke="#111827" stroke-width="1"/>

  <!-- Water drops around bottom -->
  <circle cx="30" cy="85" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="70" cy="85" r="2" fill="#38bdf8" opacity="0.7"/>
  <circle cx="50" cy="90" r="2" fill="#38bdf8" opacity="0.7"/>
</svg>