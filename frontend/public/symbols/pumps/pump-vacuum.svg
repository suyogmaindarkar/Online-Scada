<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="vacuumBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Motor section (left) -->
  <rect x="10" y="35" width="30" height="35" fill="url(#vacuumBody)" stroke="#1e293b" stroke-width="1.5" rx="3"/>

  <!-- Motor cooling fins -->
  <line x1="15" y1="35" x2="15" y2="30" stroke="#1e293b" stroke-width="1"/>
  <line x1="20" y1="35" x2="20" y2="30" stroke="#1e293b" stroke-width="1"/>
  <line x1="25" y1="35" x2="25" y2="30" stroke="#1e293b" stroke-width="1"/>
  <line x1="30" y1="35" x2="30" y2="30" stroke="#1e293b" stroke-width="1"/>
  <line x1="35" y1="35" x2="35" y2="30" stroke="#1e293b" stroke-width="1"/>

  <!-- Coupling -->
  <rect x="40" y="48" width="8" height="9" fill="#6b7280" stroke="#1e293b" stroke-width="1"/>

  <!-- Pump body (right - larger) -->
  <ellipse cx="70" cy="52" rx="22" ry="22" fill="url(#vacuumBody)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Vacuum chamber indicator (concentric circles) -->
  <circle cx="70" cy="52" r="14" fill="none" stroke="#1e293b" stroke-width="1"/>
  <circle cx="70" cy="52" r="8" fill="#1e293b" stroke="#0f172a" stroke-width="0.5"/>
  <circle cx="70" cy="52" r="3" fill="#dc2626"/>

  <!-- Suction port (bottom) -->
  <rect x="66" y="74" width="8" height="12" fill="#9ca3af" stroke="#1e293b" stroke-width="1"/>

  <!-- Exhaust port (top) -->
  <rect x="66" y="20" width="8" height="12" fill="#9ca3af" stroke="#1e293b" stroke-width="1"/>
  <path d="M 66 20 L 74 20 L 78 15 L 62 15 Z" fill="#94a3b8" stroke="#1e293b" stroke-width="1"/>

  <!-- Vacuum gauge -->
  <circle cx="88" cy="30" r="6" fill="#f9fafb" stroke="#1e293b" stroke-width="1"/>
  <line x1="88" y1="30" x2="91" y2="27" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Base -->
  <rect x="8" y="80" width="90" height="6" fill="#374151" stroke="#1e293b" stroke-width="1"/>

  <!-- Label -->
  <text x="50" y="94" text-anchor="middle" font-family="Arial" font-size="6" fill="#6b7280">VACUUM PUMP</text>
</svg>