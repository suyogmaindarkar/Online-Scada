<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="pumpVolute" cx="0.4" cy="0.4">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </radialGradient>
  </defs>

  <!-- Main volute casing (circular) -->
  <circle cx="45" cy="50" r="30" fill="url(#pumpVolute)" stroke="#18181b" stroke-width="2"/>

  <!-- Inner circle (impeller housing) -->
  <circle cx="45" cy="50" r="20" fill="#52525b" stroke="#18181b" stroke-width="1"/>

  <!-- Impeller blades -->
  <path d="M 45 35 Q 55 40 55 50 Q 55 60 45 65 Q 35 60 35 50 Q 35 40 45 35"
    fill="#71717a" stroke="#27272a" stroke-width="0.5"/>
  <circle cx="45" cy="50" r="4" fill="#18181b"/>

  <!-- Discharge pipe (going up) -->
  <rect x="42" y="15" width="8" height="12" fill="#9ca3af" stroke="#18181b" stroke-width="1"/>
  <rect x="38" y="10" width="16" height="6" fill="#71717a" stroke="#18181b" stroke-width="1"/>

  <!-- Suction pipe (going right) -->
  <rect x="72" y="47" width="20" height="8" fill="#9ca3af" stroke="#18181b" stroke-width="1"/>
  <rect x="88" y="43" width="8" height="16" fill="#71717a" stroke="#18181b" stroke-width="1"/>

  <!-- Base -->
  <rect x="20" y="80" width="50" height="8" fill="#525252" stroke="#18181b" stroke-width="1"/>
  <circle cx="27" cy="84" r="1.5" fill="#18181b"/>
  <circle cx="63" cy="84" r="1.5" fill="#18181b"/>
</svg>