<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="dosingBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Control head (top) -->
  <rect x="30" y="10" width="40" height="20" fill="url(#dosingBody)" stroke="#581c87" stroke-width="1.5" rx="3"/>

  <!-- Display screen -->
  <rect x="35" y="14" width="30" height="8" fill="#0f172a" stroke="#000" stroke-width="0.5" rx="1"/>
  <text x="50" y="20" text-anchor="middle" font-family="monospace" font-size="6" fill="#22c55e">0.50 L/h</text>

  <!-- Control knob -->
  <circle cx="65" cy="26" r="2" fill="#fbbf24" stroke="#78350f" stroke-width="0.5"/>

  <!-- Main pump body -->
  <rect x="35" y="30" width="30" height="35" fill="#8b5cf6" stroke="#581c87" stroke-width="1.5"/>

  <!-- Diaphragm indicator circle -->
  <circle cx="50" cy="47" r="10" fill="#a78bfa" stroke="#581c87" stroke-width="1"/>
  <circle cx="50" cy="47" r="6" fill="#c4b5fd"/>
  <circle cx="50" cy="47" r="2" fill="#581c87"/>

  <!-- Discharge tube (top out) -->
  <rect x="47" y="65" width="6" height="15" fill="#d1d5db" stroke="#1f2937" stroke-width="1"/>
  <ellipse cx="50" cy="80" rx="4" ry="1.5" fill="#1e40af"/>

  <!-- Suction (left) -->
  <rect x="20" y="55" width="15" height="6" fill="#d1d5db" stroke="#1f2937" stroke-width="1"/>

  <!-- Base -->
  <rect x="30" y="80" width="40" height="6" fill="#4b5563" stroke="#1f2937" stroke-width="1"/>

  <!-- Label -->
  <text x="50" y="94" text-anchor="middle" font-family="Arial" font-size="7" fill="#6b7280">DOSING</text>
</svg>