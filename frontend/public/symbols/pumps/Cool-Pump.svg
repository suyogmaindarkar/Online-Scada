<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Main Volute Housing Gradient -->
    <radialGradient id="coolHousingGrad" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="40%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </radialGradient>

    <!-- Pipe Gradient (Top-to-bottom cylindrical metallic shading) -->
    <linearGradient id="coolPipeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52525b"/>
      <stop offset="35%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Base / Socket Gradient -->
    <linearGradient id="coolBaseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Flange Gradient -->
    <linearGradient id="coolFlangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>

    <!-- Impeller Blade Gradient -->
    <linearGradient id="coolImpellerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#52525b"/>
    </linearGradient>
  </defs>

  <!-- ====== LAYER 1: PIPES AND BASES (Drawn First & Extended Deeply) ====== -->
  
  <!-- Left Ground Plate & Socket Foot -->
  <rect x="1" y="93" width="29.5" height="4" rx="0.5" fill="url(#coolBaseGrad)" stroke="#18181b" stroke-width="0.8"/>
  <line x1="2" y1="94" x2="29" y2="94" stroke="#d4d4d8" stroke-width="0.3" opacity="0.4"/>
  <!-- Top Y mathematically shifted up to 70 to tuck massively behind the housing -->
  <polygon points="14.5,70 39.2,70 28.9,93 10.9,93" fill="url(#coolBaseGrad)" stroke="#18181b" stroke-width="0.8"/>

  <!-- Right Ground Plate & Socket Foot -->
  <rect x="54.5" y="93" width="29.5" height="4" rx="0.5" fill="url(#coolBaseGrad)" stroke="#18181b" stroke-width="0.8"/>
  <line x1="55.5" y1="94" x2="83" y2="94" stroke="#d4d4d8" stroke-width="0.3" opacity="0.4"/>
  <polygon points="70.5,70 45.8,70 56.1,93 74.1,93" fill="url(#coolBaseGrad)" stroke="#18181b" stroke-width="0.8"/>

  <!-- Top-Right Discharge Pipe -->
  <!-- Mathematical check: Housing cy=46.5, r=41.5. Top of housing = 5.0. 
       Pipe y=5.0 to guarantee perfect scale tangency like the original! -->
  <rect x="30" y="5.0" width="65" height="24.4" fill="url(#coolPipeGrad)" stroke="#18181b" stroke-width="0.8"/>
  <rect x="30" y="7.5" width="65" height="2" fill="#d4d4d8" opacity="0.2"/>

  <!-- Flange -->
  <rect x="94.5" y="1" width="4.5" height="32.4" rx="0.5" fill="url(#coolFlangeGrad)" stroke="#18181b" stroke-width="0.8"/>
  <line x1="95.5" y1="2" x2="95.5" y2="32" stroke="#d4d4d8" stroke-width="0.3" opacity="0.4"/>

  <!-- ====== LAYER 2: MAIN HOUSING ====== -->
  
  <!-- Outer Bevelled Edge -->
  <circle cx="42.5" cy="46.5" r="41.5" fill="url(#coolHousingGrad)" stroke="#18181b" stroke-width="1"/>
  
  <!-- Main Inner Body -->
  <circle cx="42.5" cy="46.5" r="37.5" fill="url(#coolHousingGrad)" stroke="#27272a" stroke-width="0.8"/>

  <!-- ====== LAYER 3: INTAKE & IMPELLER ====== -->
  
  <!-- Intake Compartment (Dark Center) -->
  <circle cx="42.5" cy="46.5" r="13.3" fill="#27272a" stroke="#18181b" stroke-width="1"/>
  <circle cx="42.5" cy="46.5" r="12" fill="none" stroke="#52525b" stroke-width="0.5"/>

  <!-- 8-Blade Paddle Impeller (Tapered custom shape matching original) -->
  <g transform="translate(42.5, 46.5)" fill="url(#coolImpellerGrad)" stroke="#18181b" stroke-width="0.5">
    <polygon points="1,1 -1,1 -1.5,-11.5 1.5,-11.5" transform="rotate(0)" />
    <polygon points="1,1 -1,1 -1.5,-11.5 1.5,-11.5" transform="rotate(45)" />
    <polygon points="1,1 -1,1 -1.5,-11.5 1.5,-11.5" transform="rotate(90)" />
    <polygon points="1,1 -1,1 -1.5,-11.5 1.5,-11.5" transform="rotate(135)" />
    <polygon points="1,1 -1,1 -1.5,-11.5 1.5,-11.5" transform="rotate(180)" />
    <polygon points="1,1 -1,1 -1.5,-11.5 1.5,-11.5" transform="rotate(225)" />
    <polygon points="1,1 -1,1 -1.5,-11.5 1.5,-11.5" transform="rotate(270)" />
    <polygon points="1,1 -1,1 -1.5,-11.5 1.5,-11.5" transform="rotate(315)" />
  </g>

  <!-- Center Suspension Cap -->
  <circle cx="42.5" cy="46.5" r="3.4" fill="url(#coolBaseGrad)" stroke="#18181b" stroke-width="0.6"/>
  <circle cx="42.5" cy="46.5" r="1" fill="#18181b"/>
</svg>