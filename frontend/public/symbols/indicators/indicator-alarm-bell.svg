<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bellGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Sound waves left -->
  <path d="M 8 45 Q 15 50 8 55" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.7"/>
  <path d="M 4 40 Q 15 50 4 60" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.5"/>

  <!-- Sound waves right -->
  <path d="M 92 45 Q 85 50 92 55" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.7"/>
  <path d="M 96 40 Q 85 50 96 60" fill="none" stroke="#dc2626" stroke-width="2" opacity="0.5"/>

  <!-- Bell body (dome shape) -->
  <path d="M 30 65 Q 30 25 50 20 Q 70 25 70 65 Z" fill="url(#bellGrad)" stroke="#78350f" stroke-width="2"/>

  <!-- Bell base ring -->
  <rect x="28" y="65" width="44" height="6" fill="#78350f" stroke="#451a03" stroke-width="1" rx="2"/>

  <!-- Bell striker/hammer (inside, hanging) -->
  <line x1="50" y1="35" x2="50" y2="75" stroke="#1f2937" stroke-width="1"/>
  <circle cx="50" cy="78" r="4" fill="#374151" stroke="#111827" stroke-width="1"/>

  <!-- Bell top loop -->
  <path d="M 47 20 Q 47 12 50 12 Q 53 12 53 20" fill="none" stroke="#78350f" stroke-width="2"/>

  <!-- Highlight -->
  <path d="M 38 40 Q 40 30 45 26" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.7"/>

  <!-- ALARM text -->
  <rect x="30" y="80" width="40" height="10" fill="#dc2626" stroke="#7f1d1d" stroke-width="1"/>
  <text x="50" y="87" text-anchor="middle" font-family="Arial" font-size="8" font-weight="bold" fill="#fff">ALARM</text>
</svg>