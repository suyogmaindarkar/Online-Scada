<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="beaconLight" cx="0.5" cy="0.3">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <!-- Beacon top cap -->
  <ellipse cx="50" cy="15" rx="20" ry="4" fill="#525252" stroke="#171717" stroke-width="1"/>

  <!-- Beacon dome (glowing red) -->
  <ellipse cx="50" cy="35" rx="22" ry="25" fill="url(#beaconLight)" stroke="#7f1d1d" stroke-width="2"/>

  <!-- Highlight reflection -->
  <ellipse cx="42" cy="25" rx="5" ry="8" fill="#fef2f2" opacity="0.6"/>

  <!-- Light rays (rotating effect - flash pattern) -->
  <line x1="10" y1="35" x2="25" y2="35" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <line x1="75" y1="35" x2="90" y2="35" stroke="#fbbf24" stroke-width="2" opacity="0.7"/>
  <line x1="20" y1="15" x2="30" y2="25" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>
  <line x1="80" y1="15" x2="70" y2="25" stroke="#fbbf24" stroke-width="2" opacity="0.5"/>

  <!-- Metal ring at base of dome -->
  <ellipse cx="50" cy="58" rx="25" ry="4" fill="#78716c" stroke="#171717" stroke-width="1"/>

  <!-- Body/base -->
  <rect x="30" y="58" width="40" height="22" fill="#57534e" stroke="#171717" stroke-width="1.5"/>

  <!-- Body vents -->
  <line x1="35" y1="65" x2="65" y2="65" stroke="#171717" stroke-width="0.5"/>
  <line x1="35" y1="70" x2="65" y2="70" stroke="#171717" stroke-width="0.5"/>
  <line x1="35" y1="75" x2="65" y2="75" stroke="#171717" stroke-width="0.5"/>

  <!-- Mounting base -->
  <rect x="20" y="80" width="60" height="10" fill="#292524" stroke="#0c0a09" stroke-width="1.5"/>

  <!-- Bolts -->
  <circle cx="28" cy="85" r="1.5" fill="#0c0a09"/>
  <circle cx="72" cy="85" r="1.5" fill="#0c0a09"/>
</svg>