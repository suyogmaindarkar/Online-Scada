<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g transform="scale(0.333333, 0.333333)">
    <defs>
	</defs>
  <g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, false) ? 'inline' : 'none' }}">
	<g id="Indicators">
		<path hmi-bind:d="M150,240a90,90,0,{{LocalProps.Value1Swap}},1,{{LocalProps.Value1CircleX}},{{LocalProps.Value1CircleY}}L150,150" stroke="none" stroke-width="2.0" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color1)}}" />
		<path hmi-bind:d="M150,240a90,90,0,{{LocalProps.Value2Swap}},1,{{LocalProps.Value2CircleX}},{{LocalProps.Value2CircleY}}L150,150" stroke="none" stroke-width="2.0" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color2)}}" hmi-bind:transform="rotate({{LocalProps.rotation2}},150,150)" />
		<path hmi-bind:d="M150,240a90,90,0,{{LocalProps.Value3Swap}},1,{{LocalProps.Value3CircleX}},{{LocalProps.Value3CircleY}}L150,150" stroke="none" stroke-width="2.0" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color3)}}" hmi-bind:transform="rotate({{LocalProps.rotation3}},150,150)" />
	 </g>
  </g>
  <g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, true) ? 'inline' : 'none' }}">
		<circle id="Circle3" cx="150" cy="150" r="45" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color3)}}" stroke-width="90" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="30" transform="rotate(90, 150, 150)" />
		<circle id="Circle2" cx="150" cy="150" r="45" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color2)}}" stroke-width="90" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="60" transform="rotate(90, 150, 150)"/>
		<circle id="Circle1" cx="150" cy="150" r="45" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color1)}}" stroke-width="90" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="90" transform="rotate(90, 150, 150)" />
  </g>
 <g id="Legend" hmi-bind:display="{{ ParamProps.ShowLegend ? 'inline' : 'none' }}">
	<circle cx="40" cy="25" r="5" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color1)}}" />
	<circle cx="120" cy="25" r="5" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color2)}}" />
	<circle cx="200" cy="25" r="5" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color3)}}" />
	<text x="50" y="30" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="start"></text>
	<text x="130" y="30" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="start"></text>
	<text x="210" y="30" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="start"></text>
 </g>
	</hmi-animations:animations>
  </g>
</svg>