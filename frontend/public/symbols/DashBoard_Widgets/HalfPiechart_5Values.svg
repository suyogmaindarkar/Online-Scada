<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g transform="scale(0.333333, 0.666667)">
    <defs>
	</defs>
  <g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, false) ? 'inline' : 'none' }}">
	<g id="Indicators" transform="rotate(90,150,150) translate(10,0)">
		<path hmi-bind:d="M150,240a90,90,0,{{LocalProps.Value1Swap}},1,{{LocalProps.Value1CircleX}},{{LocalProps.Value1CircleY}}" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color1)}}" stroke-width="20" fill="none" />
		<path hmi-bind:d="M150,240a90,90,0,{{LocalProps.Value2Swap}},1,{{LocalProps.Value2CircleX}},{{LocalProps.Value2CircleY}}" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color2)}}" stroke-width="20" fill="none" hmi-bind:transform="rotate({{LocalProps.rotation2}},150,150)" />
		<path hmi-bind:d="M150,240a90,90,0,{{LocalProps.Value3Swap}},1,{{LocalProps.Value3CircleX}},{{LocalProps.Value3CircleY}}" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color3)}}" stroke-width="20" fill="none" hmi-bind:transform="rotate({{LocalProps.rotation3}},150,150)" />
		<path hmi-bind:d="M150,240a90,90,0,{{LocalProps.Value4Swap}},1,{{LocalProps.Value4CircleX}},{{LocalProps.Value4CircleY}}" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color4)}}" stroke-width="20" fill="none" hmi-bind:transform="rotate({{LocalProps.rotation4}},150,150)" />
		<path hmi-bind:d="M150,240a90,90,0,{{LocalProps.Value5Swap}},1,{{LocalProps.Value5CircleX}},{{LocalProps.Value5CircleY}}" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color5)}}" stroke-width="20" fill="none" hmi-bind:transform="rotate({{LocalProps.rotation5}},150,150)" />
	 </g>
  </g>
  <g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, true) ? 'inline' : 'none' }}">
	 <circle id="Circle5" cx="150" cy="150" r="90" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color5)}}" stroke-width="20" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="5" transform="rotate(180, 150, 150) translate(0,-10)" />
	 <circle id="Circle4" cx="150" cy="150" r="90" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color4)}}" stroke-width="20" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="10" transform="rotate(180, 150, 150) translate(0,-10)" />
	 <circle id="Circle3" cx="150" cy="150" r="90" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color3)}}" stroke-width="20" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="25" transform="rotate(180, 150, 150) translate(0,-10)" />
	 <circle id="Circle2" cx="150" cy="150" r="90" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color2)}}" stroke-width="20" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="50" transform="rotate(180, 150, 150) translate(0,-10)"/>
	 <circle id="Circle1" cx="150" cy="150" r="90" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color1)}}" stroke-width="20" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="75" transform="rotate(180, 150, 150) translate(0,-10)" />
  </g>
 <g id="Legend" hmi-bind:display="{{ ParamProps.ShowLegend ? 'inline' : 'none' }}">
	<circle cx="40" cy="25" r="5" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color1)}}" />
	<circle cx="120" cy="25" r="5" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color2)}}" />
	<circle cx="200" cy="25" r="5" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color3)}}" />
	<circle cx="80" cy="45" r="5" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color4)}}" />
	<circle cx="160" cy="45" r="5" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color5)}}" />
	<text x="50" y="30" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="start"></text>
	<text x="130" y="30" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="start"></text>
	<text x="210" y="30" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="start"></text>
	<text x="90" y="50" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="start"></text>
	<text x="170" y="50" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="start"></text>
 </g>
	</hmi-animations:animations>
  </g>
</svg>