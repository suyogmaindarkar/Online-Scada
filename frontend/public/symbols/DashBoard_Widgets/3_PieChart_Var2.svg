<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g transform="scale(0.5, 0.5)">
    <defs>
	</defs>
 <g id="Indicators">
	<g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, false) ? 'inline' : 'none' }}">
		<path hmi-bind:d="M100,190a90,90,0,{{LocalProps.Value3Swap}},1,{{LocalProps.Value3CircleX}},{{LocalProps.Value3CircleY}}" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color3)}}" stroke-width="20" fill="none" hmi-bind:transform="rotate({{LocalProps.rotation3}},100,100)" />	
		<path hmi-bind:d="M100,190a90,90,0,{{LocalProps.Value2Swap}},1,{{LocalProps.Value2CircleX}},{{LocalProps.Value2CircleY}}" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color2)}}" stroke-width="20" fill="none" hmi-bind:transform="rotate({{LocalProps.rotation2}},100,100)" />
		<path hmi-bind:d="M100,190a90,90,0,{{LocalProps.Value1Swap}},1,{{LocalProps.Value1CircleX}},{{LocalProps.Value1CircleY}}" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color1)}}" stroke-width="20" fill="none" />
	</g>
	<g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, true) ? 'inline' : 'none' }}">
		<circle id="CircleBig" cx="100" cy="100" r="90" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color3)}}" stroke-width="20" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="30" transform="rotate(90, 100, 100)" />
		<circle id="CircleMid" cx="100" cy="100" r="90" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color2)}}" stroke-width="20" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="60" transform="rotate(90, 100, 100)"/>
		<circle id="CircleSmall" cx="100" cy="100" r="90" hmi-bind:stroke="{{Converter.RGBA(ParamProps.Color1)}}" stroke-width="20" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="90" transform="rotate(90, 100, 100)"/>
	</g>
 </g>
	</hmi-animations:animations>
  </g>
</svg>