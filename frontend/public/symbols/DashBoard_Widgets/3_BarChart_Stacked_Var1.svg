 </g>
	<line id="Zero_Line" x1="90" y1="135" x2="100" y2="135" hmi-bind:stroke="{{Converter.RGBA(ParamProps.ColorLine)}}" stroke-width="2.0" />
 <line id="Zero_Line" x1="100" y1="15" x2="100" y2="135" hmi-bind:stroke="{{Converter.RGBA(ParamProps.ColorLine)}}" stroke-width="2.0" />
