<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g transform="scale(0.333333, 0.666667)">
    <defs>
  </defs> 
  <g id="Frame">
	<rect id="Frame_Box" x="1" y="1" width="300" height="150" stroke="#0058B0" stroke-width="0" fill="none" />
  </g>
 	<line id="Zero_Line" x1="90" y1="15" x2="100" y2="15" hmi-bind:stroke="{{Converter.RGBA(ParamProps.ColorLine)}}" stroke-width="2.0" />
 <g id="Bar1">
 	<text x="95" y="40" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="end"></text>
	<rect id="Bar1Background" x="100" y="22" width="175"  height="25" stroke="#000000" stroke-width="0" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorBarBackground)}}"  />
	<g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, false) ? 'inline' : 'none' }}">
		<rect x="100" y="22" hmi-bind:width="{{ ((LocalProps.IntValue1) / (ParamProps.MaxRange) * 175) }}"  height="25" stroke="#000000" stroke-width="0" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color1)}}"  />
	</g>
	<g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, true) ? 'inline' : 'none' }}">
		<rect id="Bar1Bar" x="100" y="22" height="25" stroke="#000000" stroke-width="0" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color1)}}"  />
	</g>
	<text x="295" y="40" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="end"></text>
 </g>
	<line id="Zero_Line" x1="90" y1="55" x2="100" y2="55" hmi-bind:stroke="{{Converter.RGBA(ParamProps.ColorLine)}}" stroke-width="2.0" />
 <g id="Bar2">
 	<text x="95" y="80" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12" text-anchor="end"></text>
	<rect id="Bar2Background" x="100" y="62" width="175"  height="25" stroke="#000000" stroke-width="0" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorBarBackground)}}"  />
	<g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, false) ? 'inline' : 'none' }}">
		<rect hmi-bind:x="{{ 100+((LocalProps.IntValue1) / (ParamProps.MaxRange) * 175) }}" y="62" hmi-bind:width="{{ ((LocalProps.IntValue2) / (ParamProps.MaxRange) * 175) }}"  height="25" stroke="#000000" stroke-width="0" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color2)}}"  />
	</g>
	<g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, true) ? 'inline' : 'none' }}">
		<rect id="Bar2Bar" y="62" height="25" stroke="#000000" stroke-width="0" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color2)}}"  />
	</g>
	<text x="295" y="80" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12"  text-anchor="end"></text>
 </g>
	<line id="Zero_Line" x1="90" y1="95" x2="100" y2="95" hmi-bind:stroke="{{Converter.RGBA(ParamProps.ColorLine)}}" stroke-width="2.0" /> 
 <g id="Bar3">
 	<text x="95" y="120" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorText)}}" font-family="Arial" font-size="12" text-anchor="end"></text>
	<rect id="Bar2Background" x="100" y="102" width="175"  height="25" stroke="#000000" stroke-width="0" hmi-bind:fill="{{Converter.RGBA(ParamProps.ColorBarBackground)}}"  />
	<g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, false) ? 'inline' : 'none' }}">
		<rect hmi-bind:x="{{ 100+(((LocalProps.IntValue1)+(LocalProps.IntValue2)) / (ParamProps.MaxRange) * 175) }}" y="102" hmi-bind:width="{{ ((LocalProps.IntValue3) / (ParamProps.MaxRange) * 175) }}"  height="25" stroke="#000000" stroke-width="0" hmi-bind:fill="{{Converter.RGBA(ParamProps.Color3)}}"  />
	</g>
	<g hmi-bind:display="{{ eq(ParamProps.EnableAnimation, true) ? 'inline' : 'none' }}">
